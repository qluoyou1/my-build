name: Hako Client Release Build (Unsigned)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0 或 1.0.0-beta.1)'
        required: true
        type: string
      prerelease:
        description: '标记为 Pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CODE_SIGNING_ALLOWED: "NO"
  CODE_SIGN_IDENTITY: ""
  CODE_SIGNING_REQUIRED: "NO"

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            scheme: HakoClient
            destination: "generic/platform=iOS"
            artifact: HakoClient-iOS
            type: ipa
          - platform: tvOS
            scheme: HakoTV
            destination: "generic/platform=tvOS"
            artifact: HakoClient-tvOS
            type: ipa
          - platform: macOS
            scheme: HakoMac
            destination: "generic/platform=macOS"
            artifact: HakoClient-macOS
            type: dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: TokenPLS/Hako-Client
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          xcodebuild -showsdks

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install tools
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/DerivedData
          # key 建议绑定 platform、Lock 文件以及源码文件哈希
          key: xcode-cache-${{ matrix.platform }}-${{ hashFiles('apple/**', 'Dependencies.lock.json') }}
          # 源码变动时，降级使用上一次的构建缓存做增量编译
          restore-keys: |
            xcode-cache-${{ matrix.platform }}-

      

      - name: Bootstrap (Kernel + Adapter + SDK)
        run: |
          python3 -m venv .build/python-env
          source .build/python-env/bin/activate
          python3 -m pip install --upgrade pip PyYAML
          python3 scripts/bootstrap.py
        env:
          GOTOOLCHAIN: auto

      - name: Configure project
        run: |
          source .build/python-env/bin/activate
          python3 scripts/configure.py

      - name: Build and Archive ${{ matrix.platform }}
        id: archive
        run: |
          set -euo pipefail
          ARCHIVE_DIR="${{ runner.temp }}/archives"
          DERIVED_DATA="${{ runner.temp }}/DerivedData"
          mkdir -p "$ARCHIVE_DIR" "$DERIVED_DATA"
          ARCHIVE_PATH="$ARCHIVE_DIR/${{ matrix.artifact }}.xcarchive"

          xcodebuild \
            -project apple/HakoClient/HakoClient.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -configuration Release \
            -destination "${{ matrix.destination }}" \
            -derivedDataPath "$DERIVED_DATA" \
            archive \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package artifact (IPA / DMG)
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          OUT_DIR="${{ runner.temp }}/artifacts"
          mkdir -p "$OUT_DIR"
          ARCHIVE_PATH="${{ steps.archive.outputs.archive_path }}"

          APP_DIR="$ARCHIVE_PATH/Products/Applications"
          APP_PATH=$(find "$APP_DIR" -maxdepth 1 -name "*.app" | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "::error::未在 $APP_DIR 找到 .app 文件"
            exit 1
          fi

          echo "Found app at: $APP_PATH"

          case "${{ matrix.type }}" in
            ipa)
              echo "Packaging as IPA..."
              PAYLOAD_DIR="${{ runner.temp }}/Payload"
              rm -rf "$PAYLOAD_DIR"
              mkdir -p "$PAYLOAD_DIR"
              
              # 规范：IPA 内部根目录必须为 Payload
              cp -R "$APP_PATH" "$PAYLOAD_DIR/"
              
              IPA_NAME="${{ matrix.artifact }}-${VERSION}.ipa"
              (cd "${{ runner.temp }}" && zip -qr "$OUT_DIR/$IPA_NAME" Payload)
              rm -rf "$PAYLOAD_DIR"
              echo "Generated: $OUT_DIR/$IPA_NAME"
              ;;
              
            dmg)
              echo "Packaging as DMG..."
              DMG_TEMP_DIR="${{ runner.temp }}/dmg_root"
              rm -rf "$DMG_TEMP_DIR"
              mkdir -p "$DMG_TEMP_DIR"
              
              # 复制应用并生成 /Applications 快捷方式软链接
              cp -R "$APP_PATH" "$DMG_TEMP_DIR/"
              ln -s /Applications "$DMG_TEMP_DIR/Applications"
              
              DMG_NAME="${{ matrix.artifact }}-${VERSION}.dmg"
              hdiutil create \
                -volname "${{ matrix.scheme }}" \
                -srcfolder "$DMG_TEMP_DIR" \
                -ov \
                -format UDZO \
                "$OUT_DIR/$DMG_NAME"
                
              rm -rf "$DMG_TEMP_DIR"
              echo "Generated: $OUT_DIR/$DMG_NAME"
              ;;
          esac

          ls -lh "$OUT_DIR"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ inputs.version }}
          path: ${{ runner.temp }}/artifacts/*
          retention-days: 7
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: |
          echo "=== Release assets ==="
          find release-assets -type f -ls
          ls -lhR release-assets

      - name: Create Release & Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Hako-Client-v${{ inputs.version }}
          name: Hako Client v${{ inputs.version }}
          body: |
            ## Hako Client ${{ inputs.version }}

            **Unsigned builds** (for compilation verification / sideload testing only).

            ### Assets
            - **iOS** – Unsigned IPA (`HakoClient-iOS-*.ipa`)
            - **tvOS** – Unsigned IPA (`HakoClient-tvOS-*.ipa`)
            - **macOS** – Disk Image (`HakoClient-macOS-*.dmg`)

            ### Notes
            - Built from commit `${{ github.sha }}`
            - No code signing applied (`CODE_SIGNING_ALLOWED=NO`)
            - **iOS / tvOS**: Install via TrollStore, AltStore, Sideloadly or re-sign manually.
            - **macOS**: Drag to Applications folder. May require right-click -> Open or `xattr -cr` due to Gatekeeper.

            ---
            Built with GitHub Actions · [Workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          draft: false
          prerelease: ${{ inputs.prerelease }}
          files: |
            release-assets/**
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
