name: Hako Client Release Build (Unsigned)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0 或 1.0.0-beta.1)'
        required: true
        type: string
      prerelease:
        description: '标记为 Pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CODE_SIGNING_ALLOWED: "NO"
  CODE_SIGN_IDENTITY: ""
  CODE_SIGNING_REQUIRED: "NO"

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            scheme: HakoClient
            destination: "generic/platform=iOS"
            artifact: HakoClient-iOS
            type: ipa
          - platform: tvOS
            scheme: HakoTV
            destination: "generic/platform=tvOS"
            artifact: HakoClient-tvOS
            type: ipa
          - platform: macOS
            scheme: HakoMac
            destination: "generic/platform=macOS"
            artifact: HakoClient-macOS
            type: dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: TokenPLS/Hako-Client
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          xcodebuild -showsdks

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install tools
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache SDK dependencies
        uses: actions/cache@v4
        with:
          path: |
            .build/dependencies
            .build/bin
            Hako.xcframework
          key: hako-sdk-${{ hashFiles('Dependencies.lock.json') }}-${{ runner.os }}

      - name: Bootstrap (Kernel + Adapter + SDK)
        run: |
          python3 -m venv .build/python-env
          source .build/python-env/bin/activate
          python3 -m pip install --upgrade pip PyYAML
          python3 scripts/bootstrap.py
        env:
          GOTOOLCHAIN: auto

      - name: Configure project
        run: |
          source .build/python-env/bin/activate
          python3 scripts/configure.py
          mkdir -p .build/dependencies .build/bin

      - name: Build and Archive ${{ matrix.platform }}
        id: archive
        run: |
          set -euo pipefail
          ARCHIVE_DIR="${{ runner.temp }}/archives"
          mkdir -p "$ARCHIVE_DIR"
          ARCHIVE_PATH="$ARCHIVE_DIR/${{ matrix.artifact }}.xcarchive"

          xcodebuild \
            -project apple/HakoClient/HakoClient.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -configuration Release \
            -destination "${{ matrix.destination }}" \
            archive \
            -archivePath "$ARCHIVE_PATH" \
            SKIP_INSTALL=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            PROVISIONING_PROFILE_SPECIFIER=""

          echo "archive_path=$ARCHIVE_PATH" >> "$GITHUB_OUTPUT"

      - name: Package artifact (IPA / DMG)
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          OUT_DIR="${{ runner.temp }}/artifacts"
          mkdir -p "$OUT_DIR"

          ARCHIVE_PATH="${{ steps.archive.outputs.archive_path }}"
          if [ -z "$ARCHIVE_PATH" ] || [ ! -d "$ARCHIVE_PATH" ]; then
            ARCHIVE_PATH="${{ runner.temp }}/archives/${{ matrix.artifact }}.xcarchive"
          fi

          if [ ! -d "$ARCHIVE_PATH" ]; then
            echo "::error::Archive 目录不存在: $ARCHIVE_PATH"
            exit 1
          fi

          echo "Archive path: $ARCHIVE_PATH"
          echo "=== Archive 目录诊断 ==="
          find "$ARCHIVE_PATH" -maxdepth 3 -ls || true

          APP_PATH=""
          if [ -d "$ARCHIVE_PATH/Products/Applications" ]; then
            APP_PATH=$(find "$ARCHIVE_PATH/Products/Applications" -maxdepth 2 -name "*.app" | head -n 1)
          fi

          if [ -z "$APP_PATH" ] && [ -d "$ARCHIVE_PATH/Products" ]; then
            APP_PATH=$(find "$ARCHIVE_PATH/Products" -name "*.app" | head -n 1)
          fi

          if [ -z "$APP_PATH" ]; then
            echo "::error::未在 $ARCHIVE_PATH/Products 下找到 .app 文件！"
            exit 1
          fi

          echo "Found app at: $APP_PATH"

          case "${{ matrix.type }}" in
            ipa)
              echo "Packaging as IPA..."
              PAYLOAD_DIR="${{ runner.temp }}/Payload"
              rm -rf "$PAYLOAD_DIR"
              mkdir -p "$PAYLOAD_DIR"
              cp -R "$APP_PATH" "$PAYLOAD_DIR/"

              IPA_NAME="${{ matrix.artifact }}-${VERSION}.ipa"
              (cd "${{ runner.temp }}" && zip -qr "$OUT_DIR/$IPA_NAME" Payload)
              rm -rf "$PAYLOAD_DIR"
              echo "Generated IPA: $OUT_DIR/$IPA_NAME"
              ;;

            dmg)
              echo "Packaging as DMG..."
              DMG_TEMP_DIR="${{ runner.temp }}/dmg_root"
              rm -rf "$DMG_TEMP_DIR"
              mkdir -p "$DMG_TEMP_DIR"

              cp -R "$APP_PATH" "$DMG_TEMP_DIR/"
              ln -s /Applications "$DMG_TEMP_DIR/Applications"

              DMG_NAME="${{ matrix.artifact }}-${VERSION}.dmg"
              hdiutil create \
                -volname "${{ matrix.scheme }}" \
                -srcfolder "$DMG_TEMP_DIR" \
                -ov \
                -format UDZO \
                "$OUT_DIR/$DMG_NAME"

              rm -rf "$DMG_TEMP_DIR"
              echo "Generated DMG: $OUT_DIR/$DMG_NAME"
              ;;
          esac

          ls -lh "$OUT_DIR"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ inputs.version }}
          path: ${{ runner.temp }}/artifacts/*
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Hako-Client-v${{ inputs.version }}
          name: Hako Client v${{ inputs.version }}
          body: |
            ## Hako Client ${{ inputs.version }} (Unsigned Release)

            ### Assets
            - **iOS**: `HakoClient-iOS-*.ipa` (Install via TrollStore / AltStore / Sideloadly)
            - **tvOS**: `HakoClient-tvOS-*.ipa` (Install via Sideloadly / Apple TV Sideload)
            - **macOS**: `HakoClient-macOS-*.dmg` (Drag to Applications)

            ### Build Info
            - Commit: `${{ github.sha }}`
            - Code Signing: Disabled (`CODE_SIGNING_ALLOWED=NO`)
          draft: false
          prerelease: ${{ inputs.prerelease }}
          files: release-assets/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
