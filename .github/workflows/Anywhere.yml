name: Everywhere Release Build (iOS Only)

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (例如 1.0.0 或 1.0.0-beta.1)'
        required: true
        type: string
        default: '2.3'
      prerelease:
        description: '标记为 Pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CODE_SIGNING_ALLOWED: "NO"
  CODE_SIGN_IDENTITY: ""
  CODE_SIGNING_REQUIRED: "NO"

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: NodePassProject/Everywhere
          fetch-depth: 0
          submodules: recursive

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks

      - name: Detect Project & Primary Scheme
        id: proj
        run: |
          set -euo pipefail
          echo "=== 检查工程与 Schemes 列表 ==="
          if [ -d "Everywhere.xcworkspace" ]; then
            PROJ_FLAG="-workspace Everywhere.xcworkspace"
          elif [ -f "$(find . -maxdepth 2 -name '*.xcworkspace' | head -1)" ]; then
            PROJ_FLAG="-workspace $(find . -maxdepth 2 -name '*.xcworkspace' | head -1)"
          else
            PROJ_FILE=$(find . -maxdepth 2 -name "*.xcodeproj" | head -1)
            PROJ_FLAG="-project $PROJ_FILE"
          fi
          echo "proj_flag=$PROJ_FLAG" >> "$GITHUB_OUTPUT"

          SCHEME=$(xcodebuild $PROJ_FLAG -list -json | python3 -c "
          import sys, json
          try:
              data = json.load(sys.stdin)
              schemes = data.get('workspace', {}).get('schemes', []) or data.get('project', {}).get('schemes', [])
              main_schemes = [s for s in schemes if 'Test' not in s and 'Extension' not in s]
              if 'Everywhere' in main_schemes:
                  print('Everywhere')
              elif main_schemes:
                  print(main_schemes[0])
              elif schemes:
                  print(schemes[0])
              else:
                  print('Everywhere')
          except Exception:
              print('Everywhere')
          ")
          echo "Selected Scheme: $SCHEME"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Force Manual Signing in Project
        run: |
          set -euo pipefail
          echo "=== 强制关闭 Automatic Signing 校验，防止缺证书报错 ==="
          python3 -c "
          import re, glob
          for pbx in glob.glob('**/*.pbxproj', recursive=True):
              with open(pbx, 'r', encoding='utf-8') as f:
                  content = f.read()
              content = re.sub(r'CODE_SIGN_STYLE\s*=\s*Automatic;', 'CODE_SIGN_STYLE = Manual;', content)
              content = re.sub(r'PROVISIONING_PROFILE_SPECIFIER\s*=\s*[^;]+;', 'PROVISIONING_PROFILE_SPECIFIER = \"\";', content)
              content = re.sub(r'\"?PROVISIONING_PROFILE\"?\s*=\s*[^;]+;', 'PROVISIONING_PROFILE = \"\";', content)
              content = re.sub(r'CODE_SIGN_IDENTITY\s*=\s*[^;]+;', 'CODE_SIGN_IDENTITY = \"\";', content)
              content = re.sub(r'DEVELOPMENT_TEAM\s*=\s*[^;]+;', 'DEVELOPMENT_TEAM = \"\";', content)
              with open(pbx, 'w', encoding='utf-8') as f:
                  f.write(content)
              print(f'Stripped signing from: {pbx}')
          "

      - name: Cache SwiftPM Packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved', '**/*.xcodeproj/project.pbxproj') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Build and Archive iOS
        id: archive
        run: |
          set -euo pipefail
          ARCHIVE_DIR="${{ runner.temp }}/archives"
          mkdir -p "$ARCHIVE_DIR"
          ARCHIVE_PATH="$ARCHIVE_DIR/Everywhere-iOS.xcarchive"
          SCHEME="${{ steps.proj.outputs.scheme }}"
          PROJ_FLAG="${{ steps.proj.outputs.proj_flag }}"

          ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          cd "$ROOT"
          # wire_project.rb needs the xcodeproj gem; install it (user dir, no sudo) if absent.
          ruby -e "require 'xcodeproj'" 2>/dev/null || gem install --user-install xcodeproj
          ruby Scripts/wire_project.rb
          
          xcodebuild \
            $PROJ_FLAG \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            archive \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            PROVISIONING_PROFILE_SPECIFIER=""

          echo "archive_path=$ARCHIVE_PATH" >> "$GITHUB_OUTPUT"

      - name: Package artifact (IPA)
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          OUT_DIR="${{ runner.temp }}/artifacts"
          mkdir -p "$OUT_DIR"
          ARCHIVE_PATH="${{ steps.archive.outputs.archive_path }}"

          APP_PATH=""
          if [ -d "$ARCHIVE_PATH/Products/Applications" ]; then
            APP_PATH=$(find "$ARCHIVE_PATH/Products/Applications" -maxdepth 2 -name "*.app" | head -n 1)
          fi
          if [ -z "$APP_PATH" ] && [ -d "$ARCHIVE_PATH/Products" ]; then
            APP_PATH=$(find "$ARCHIVE_PATH/Products" -name "*.app" | head -n 1)
          fi

          if [ -z "$APP_PATH" ]; then
            echo "::error::未在 $ARCHIVE_PATH 下找到 .app 目标文件"
            exit 1
          fi

          PAYLOAD_DIR="${{ runner.temp }}/Payload"
          rm -rf "$PAYLOAD_DIR"
          mkdir -p "$PAYLOAD_DIR"
          cp -R "$APP_PATH" "$PAYLOAD_DIR/"

          IPA_NAME="Everywhere-iOS-${VERSION}.ipa"
          (cd "${{ runner.temp }}" && zip -qr "$OUT_DIR/$IPA_NAME" Payload)
          rm -rf "$PAYLOAD_DIR"
          ls -lh "$OUT_DIR"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Everywhere-iOS-${{ inputs.version }}
          path: ${{ runner.temp }}/artifacts/*
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build-ios
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: Everywhere-iOS-${{ inputs.version }}
          path: release-assets

      - name: Create Release & Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Everywhere-v${{ inputs.version }}
          name: Everywhere v${{ inputs.version }}
          body: |
            ## Everywhere ${{ inputs.version }} (Unsigned iOS Build)
            - **iOS**: `Everywhere-iOS-${{ inputs.version }}.ipa`
            - Code signing disabled (`CODE_SIGNING_ALLOWED=NO`)
            - Install via TrollStore, AltStore, Sideloadly or personal developer certificate.
          draft: false
          prerelease: ${{ inputs.prerelease }}
          files: release-assets/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
