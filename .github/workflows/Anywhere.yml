name: Anywhere Release Build (Unsigned)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (例如 1.0.0)'
        required: true
        type: string
        default: '1.0.0'
      prerelease:
        description: '标记为 Pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CODE_SIGNING_ALLOWED: "NO"
  CODE_SIGN_IDENTITY: ""
  CODE_SIGNING_REQUIRED: "NO"

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            scheme: Anywhere
            destination: "generic/platform=iOS"
            artifact: Anywhere-iOS
            type: ipa
          - platform: tvOS
            scheme: Anywhere tvOS
            destination: "generic/platform=tvOS"
            artifact: Anywhere-tvOS
            type: ipa
          - platform: watchOS
            scheme: Anywhere Watch App
            destination: "generic/platform=watchOS"
            artifact: Anywhere-watchOS
            type: ipa

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: NodePassProject/Anywhere
          fetch-depth: 0
          submodules: recursive

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks

      - name: Cache SwiftPM Packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved', '**/*.xcodeproj/project.pbxproj') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Detect Project & Schemes
        id: project_info
        run: |
          set -euo pipefail

          if [ -d "Anywhere.xcworkspace" ]; then
            echo "project_flag=-workspace Anywhere.xcworkspace" >> "$GITHUB_OUTPUT"
          elif [ -d "Anywhere.xcodeproj" ]; then
            echo "project_flag=-project Anywhere.xcodeproj" >> "$GITHUB_OUTPUT"
          else
            WS=$(find . -maxdepth 2 -name "*.xcworkspace" | head -1)
            PROJ=$(find . -maxdepth 2 -name "*.xcodeproj" | head -1)
            if [ -n "$WS" ]; then
              echo "project_flag=-workspace $WS" >> "$GITHUB_OUTPUT"
            elif [ -n "$PROJ" ]; then
              echo "project_flag=-project $PROJ" >> "$GITHUB_OUTPUT"
            else
              echo "::error::未找到 Xcode 工程文件！"
              exit 1
            fi
          fi

          xcodebuild -list || true

      - name: Build and Archive ${{ matrix.platform }}
        id: archive
        run: |
          set -euo pipefail
          ARCHIVE_DIR="${{ runner.temp }}/archives"
          mkdir -p "$ARCHIVE_DIR"
          ARCHIVE_PATH="$ARCHIVE_DIR/${{ matrix.artifact }}.xcarchive"

          xcodebuild \
            ${{ steps.project_info.outputs.project_flag }} \
            -scheme "${{ matrix.scheme }}" \
            -configuration Release \
            -destination "${{ matrix.destination }}" \
            archive \
            -archivePath "$ARCHIVE_PATH" \
            SKIP_INSTALL=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            PROVISIONING_PROFILE_SPECIFIER=""

          echo "archive_path=$ARCHIVE_PATH" >> "$GITHUB_OUTPUT"

      - name: Package artifact (IPA / DMG)
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          OUT_DIR="${{ runner.temp }}/artifacts"
          mkdir -p "$OUT_DIR"

          ARCHIVE_PATH="${{ steps.archive.outputs.archive_path }}"
          if [ -z "$ARCHIVE_PATH" ] || [ ! -d "$ARCHIVE_PATH" ]; then
            ARCHIVE_PATH="${{ runner.temp }}/archives/${{ matrix.artifact }}.xcarchive"
          fi

          APP_PATH=""
          if [ -d "$ARCHIVE_PATH/Products/Applications" ]; then
            APP_PATH=$(find "$ARCHIVE_PATH/Products/Applications" -maxdepth 2 -name "*.app" | head -n 1)
          fi
          if [ -z "$APP_PATH" ] && [ -d "$ARCHIVE_PATH/Products" ]; then
            APP_PATH=$(find "$ARCHIVE_PATH/Products" -name "*.app" | head -n 1)
          fi

          if [ -z "$APP_PATH" ]; then
            echo "::error::未找到 .app 文件"
            exit 1
          fi

          case "${{ matrix.type }}" in
            ipa)
              PAYLOAD_DIR="${{ runner.temp }}/Payload"
              rm -rf "$PAYLOAD_DIR"
              mkdir -p "$PAYLOAD_DIR"
              cp -R "$APP_PATH" "$PAYLOAD_DIR/"
              IPA_NAME="${{ matrix.artifact }}-${VERSION}.ipa"
              (cd "${{ runner.temp }}" && zip -qr "$OUT_DIR/$IPA_NAME" Payload)
              rm -rf "$PAYLOAD_DIR"
              ;;
            dmg)
              DMG_TEMP_DIR="${{ runner.temp }}/dmg_root"
              rm -rf "$DMG_TEMP_DIR"
              mkdir -p "$DMG_TEMP_DIR"
              cp -R "$APP_PATH" "$DMG_TEMP_DIR/"
              ln -s /Applications "$DMG_TEMP_DIR/Applications"
              DMG_NAME="${{ matrix.artifact }}-${VERSION}.dmg"
              hdiutil create -volname "${{ matrix.scheme }}" -srcfolder "$DMG_TEMP_DIR" -ov -format UDZO "$OUT_DIR/$DMG_NAME"
              rm -rf "$DMG_TEMP_DIR"
              ;;
          esac

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ inputs.version }}
          path: ${{ runner.temp }}/artifacts/*
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create Release & Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Anywhere-v${{ inputs.version }}
          name: Anywhere v${{ inputs.version }}
          body: |
            ## Anywhere ${{ inputs.version }}

            Unsigned standalone release builds.

            ### Assets
            - Built for ${{ github.sha }}
            - No code signing applied (`CODE_SIGNING_ALLOWED=NO`)
            - Target runner: `xcode-27`
          draft: false
          prerelease: ${{ inputs.prerelease }}
          files: |
            release-assets/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
