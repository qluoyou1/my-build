name: Anywhere Release Build (Unsigned)

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (例如 1.0.0 或 1.0.0-beta.1)'
        required: true
        type: string
        default: '2.3'
      prerelease:
        description: '标记为 Pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CODE_SIGNING_ALLOWED: "NO"
  CODE_SIGN_IDENTITY: ""
  CODE_SIGNING_REQUIRED: "NO"

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            scheme: Anywhere
            destination: "generic/platform=iOS"
            artifact: Anywhere-iOS
          - platform: tvOS
            scheme: Anywhere TV
            destination: "generic/platform=tvOS"
            artifact: Anywhere-tvOS
          - platform: watchOS
            scheme: Anywhere Watch App
            destination: "generic/platform=watchOS"
            artifact: Anywhere-watchOS

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: NodePassProject/Anywhere
          fetch-depth: 0
          # submodules: recursive

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks

      - name: Workaround 1 Restore Rules.db and Remove 404 AnywhereRules Dependency
        run: |
          set -euo pipefail
          echo "=== 1. 从 commit 70d0b556 恢复 Rules.db ==="
          git fetch origin 70d0b5561614f13310eb95afbfd928ad39f98509 --depth=1 || true
          git restore --source=70d0b5561614f13310eb95afbfd928ad39f98509 -- Shared/DataStore/Rules.db || true

          if [ ! -f "Shared/DataStore/Rules.db" ]; then
            echo "::error::未成功恢复 Shared/DataStore/Rules.db"
            exit 1
          fi

          echo "=== 2. 切回 RoutingRulesDatabase.swift 的 Bundle.main 逻辑 ==="
          python3 -c "
          import glob

          files = glob.glob('**/RoutingRulesDatabase.swift', recursive=True)
          for path in files:
              with open(path, 'r', encoding='utf-8') as f:
                  content = f.read()

              # 移除 import AnywhereRules
              content = '\n'.join([line for line in content.splitlines() if 'import AnywhereRules' not in line])

              # 替换 URL 加载为应用内 Bundle.main 资源
              content = content.replace('AnywhereRules.databaseURL', 'Bundle.main.url(forResource: \"Rules\", withExtension: \"db\")')

              with open(path, 'w', encoding='utf-8') as f:
                  f.write(content)
              print(f'Patched: {path}')
          "

          echo "=== 3. 彻底从 pbxproj 和 Package.resolved 中移除 AnywhereRules ==="
          python3 -c "
          import re, glob, json

          for pbx in glob.glob('**/*.pbxproj', recursive=True):
              with open(pbx, 'r', encoding='utf-8') as f:
                  content = f.read()

              content = re.sub(r'[A-F0-9]{24}\s*/\*\s*XCRemoteSwiftPackageReference \"AnywhereRules\"\s*\*/\s*=\s*\{[^}]+\};', '', content)
              content = re.sub(r'[A-F0-9]{24}\s*/\*\s*AnywhereRules\s*\*/\s*=\s*\{[^}]+\};', '', content)
              content = re.sub(r'[A-F0-9]{24}\s*/\*\s*XCRemoteSwiftPackageReference \"AnywhereRules\"\s*\*/,?', '', content)
              content = re.sub(r'[A-F0-9]{24}\s*/\*\s*AnywhereRules in Frameworks\s*\*/,?', '', content)

              with open(pbx, 'w', encoding='utf-8') as f:
                  f.write(content)
              print(f'Stripped AnywhereRules from: {pbx}')

          for res in glob.glob('**/Package.resolved', recursive=True):
              with open(res, 'r', encoding='utf-8') as f:
                  content = f.read()
              if 'AnywhereRules' in content:
                  try:
                      data = json.loads(content)
                      if 'pins' in data:
                          data['pins'] = [p for p in data['pins'] if 'AnywhereRules' not in p.get('identity', '') and 'AnywhereRules' not in p.get('location', '')]
                          with open(res, 'w', encoding='utf-8') as f:
                              json.dump(data, f, indent=2)
                          print(f'Cleaned Package.resolved pin: {res}')
                  except Exception as e:
                      print(f'Error reading {res}: {e}')
          "

      - name: Workaround 2: Fix Watch App Missing Color (Issue #100)
        if: matrix.platform == 'watchOS'
        run: |
          set -euo pipefail
          echo "=== 补全 Watch App 缺失的颜色符号 ==="
          WATCH_DIR="Anywhere Watch App"
          mkdir -p "$WATCH_DIR"

          cat << 'EOF' > "$WATCH_DIR/Color+Issue100Patch.swift"
          import SwiftUI

          public extension Color {
              #if os(watchOS)
              static let connectedBackgroundStart = Color.green.opacity(0.8)
              static let connectedBackgroundEnd = Color.green.opacity(0.4)
              #endif
          }
          EOF
          echo "已在 $WATCH_DIR 注入 Color 补丁。"

      - name: Workaround 3: Force Manual Signing in Project
        run: |
          set -euo pipefail
          echo "=== 强制关闭 Automatic Signing 校验，防止因缺 Profile 报错 ==="
          python3 -c "
          import re, glob

          for pbx in glob.glob('**/*.pbxproj', recursive=True):
              with open(pbx, 'r', encoding='utf-8') as f:
                  content = f.read()

              # 强制切换为 Manual
              content = re.sub(r'CODE_SIGN_STYLE\s*=\s*Automatic;', 'CODE_SIGN_STYLE = Manual;', content)
              content = re.sub(r'PROVISIONING_PROFILE_SPECIFIER\s*=\s*[^;]+;', 'PROVISIONING_PROFILE_SPECIFIER = \"\";', content)
              content = re.sub(r'\"?PROVISIONING_PROFILE\"?\s*=\s*[^;]+;', 'PROVISIONING_PROFILE = \"\";', content)
              content = re.sub(r'CODE_SIGN_IDENTITY\s*=\s*[^;]+;', 'CODE_SIGN_IDENTITY = \"\";', content)
              content = re.sub(r'DEVELOPMENT_TEAM\s*=\s*[^;]+;', 'DEVELOPMENT_TEAM = \"\";', content)

              with open(pbx, 'w', encoding='utf-8') as f:
                  f.write(content)
              print(f'Disabled auto signing in: {pbx}')
          "

      - name: Cache SwiftPM Packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved', '**/*.xcodeproj/project.pbxproj') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Build and Archive ${{ matrix.platform }}
        id: archive
        run: |
          set -euo pipefail
          ARCHIVE_DIR="${{ runner.temp }}/archives"
          mkdir -p "$ARCHIVE_DIR"
          ARCHIVE_PATH="$ARCHIVE_DIR/${{ matrix.artifact }}.xcarchive"

          PROJ_FLAG=""
          if [ -d "Anywhere.xcworkspace" ]; then
            PROJ_FLAG="-workspace Anywhere.xcworkspace"
          else
            PROJ_FILE=$(find . -maxdepth 2 -name "*.xcodeproj" | head -1)
            PROJ_FLAG="-project $PROJ_FILE"
          fi

          echo "Starting archive for ${{ matrix.scheme }}..."
          xcodebuild \
            $PROJ_FLAG \
            -scheme "${{ matrix.scheme }}" \
            -configuration Release \
            -destination "${{ matrix.destination }}" \
            archive \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            PROVISIONING_PROFILE_SPECIFIER=""

          echo "archive_path=$ARCHIVE_PATH" >> "$GITHUB_OUTPUT"

      - name: Package artifact (IPA)
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          OUT_DIR="${{ runner.temp }}/artifacts"
          mkdir -p "$OUT_DIR"

          ARCHIVE_PATH="${{ steps.archive.outputs.archive_path }}"
          if [ -z "$ARCHIVE_PATH" ] \vert{}\vert{} [ ! -d "$ARCHIVE_PATH" ]; then
            ARCHIVE_PATH="${{ runner.temp }}/archives/${{ matrix.artifact }}.xcarchive"
          fi

          echo "Archive path: $ARCHIVE_PATH"

          # 查找生成的 .app 产物
          APP_PATH=""
          if [ -d "$ARCHIVE_PATH/Products/Applications" ]; then
            APP_PATH=$(find "$ARCHIVE_PATH/Products/Applications" -maxdepth 2 -name "*.app" | head -n 1)
          fi

          if [ -z "$APP_PATH" ] && [ -d "$ARCHIVE_PATH/Products" ]; then
            APP_PATH=$(find "$ARCHIVE_PATH/Products" -name "*.app" | head -n 1)
          fi

          if [ -z "$APP_PATH" ]; then
            echo "::error::未在 $ARCHIVE_PATH/Products 找到任何 .app 文件"
            find "$ARCHIVE_PATH" -maxdepth 3 -ls || true
            exit 1
          fi

          echo "Found app target: $APP_PATH"
          echo "Packaging ${{ matrix.platform }} as IPA..."

          PAYLOAD_DIR="${{ runner.temp }}/Payload"
          rm -rf "$PAYLOAD_DIR"
          mkdir -p "$PAYLOAD_DIR"

          cp -R "$APP_PATH" "$PAYLOAD_DIR/"

          IPA_NAME="${{ matrix.artifact }}-${VERSION}.ipa"
          (cd "${{ runner.temp }}" && zip -qr "$OUT_DIR/$IPA_NAME" Payload)
          rm -rf "$PAYLOAD_DIR"

          echo "Generated: $OUT_DIR/$IPA_NAME"
          ls -lh "$OUT_DIR"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ inputs.version }}
          path: ${{ runner.temp }}/artifacts/*
          retention-days: 7
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: |
          echo "=== Release assets ==="
          find release-assets -type f -ls

      - name: Create Release & Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Anywhere-v${{ inputs.version }}
          name: Anywhere v${{ inputs.version }}
          body: |
            ## Anywhere ${{ inputs.version }} (Unsigned Builds)

            ### 产物列表
            - **iOS**: `Anywhere-iOS-*.ipa`
            - **tvOS**: `Anywhere-tvOS-*.ipa`
            - **watchOS**: `Anywhere-watchOS-*.ipa`

            ### 说明
            - 源码来自 commit `${{ github.sha }}`
            - 移除了无法访问的 404 外部包 `AnywhereRules`，恢复内置静态规则数据库 `Rules.db`
            - 修复了 Watch App 端的颜色缺失编译错误（Issue #100）
            - 未应用签名，可通过 TrollStore / AltStore / 自签名证书安装

            ---
            构建流水线: [Workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          draft: false
          prerelease: ${{ inputs.prerelease }}
          files: |
            release-assets/**
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
