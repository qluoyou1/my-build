name: Cherry Studio App Build and Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g., v1.0.0)'
        required: true

# 授予 GitHub Release 上传所需的写入权限
permissions:
  contents: write

jobs:
  # ==========================================
  # 1. 编译 iOS 端 (未签名)
  # ==========================================
  build-ios:
    runs-on: macos-latest
    steps:
      - name: 检出指定仓库代码
        uses: actions/checkout@v4
        with:
          repository: 'CherryHQ/cherry-studio-app'
          ref: 'main' # 可替换为指定分支或特定 tag

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.2.1

      - name: 生成 iOS 工程
        run: npx expo prebuild --platform ios

      - name: 安装 CocoaPods 依赖
        run: |
          cd ios
          pod install

      - name: 编译 iOS APP (不签名)
        run: |
          cd ios
          SCHEME_NAME=$(basename *.xcodeproj .xcodeproj)
          xcodebuild \
            -workspace *.xcworkspace \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: 打包 IPA
        run: |
          cd ios/build/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -r *.app Payload/
          zip -r app-unsigned.ipa Payload

      - name: 上传 iOS 中间产物
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ios/build/Build/Products/Release-iphoneos/app-unsigned.ipa
          retention-days: 1

  # ==========================================
  # 2. 编译 Android 端 (使用 Debug 签名免密打包)
  # ==========================================
  build-android:
    runs-on: ubuntu-24.04
    steps:
      - name: 检出指定仓库代码
        uses: actions/checkout@v4
        with:
          repository: 'CherryHQ/cherry-studio-app'
          ref: 'main' # 可替换为指定分支或特定 tag

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.2.1

      - name: 设置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 生成 Android 工程
        run: npx expo prebuild --platform android

      # 核心：将 release 构建类型的签名配置重定向为内置的 debug 签名，无需任何 Keystore 文件及密钥
      - name: 强制使用 Debug 签名配置
        run: |
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' android/app/build.gradle

      - name: 编译 Android APK
        shell: bash
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleRelease

      - name: 上传 Android 中间产物
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 1

  # ==========================================
  # 3. 统一发布两个包至同一个 GitHub Release
  # ==========================================
  publish-release:
    name: Publish Release
    # 必须等待 iOS 和 Android 两个任务均构建成功
    needs: [build-ios, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: 创建打包暂存目录
        run: mkdir -p release-assets

      - name: 下载 iOS 产物
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: release-assets

      - name: 下载 Android 产物
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets

      - name: 一起发布至 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Cherry-Studio-v${{ github.event.inputs.tag }}
          name: "Cherry Studio v${{ github.event.inputs.tag }}"
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
