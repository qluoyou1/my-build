name: meow Build Unsigned (iOS & tvOS)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (例如 1.0.0)'
        required: true
        type: string
        default: '1.0.0'
      prerelease:
        description: '标记为 Pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-meow-${{ github.ref }}
  cancel-in-progress: true

env:
  CODE_SIGNING_ALLOWED: "NO"
  CODE_SIGN_IDENTITY: ""
  CODE_SIGNING_REQUIRED: "NO"

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: macos-latest  # 如有自定义标签 runner，可替换如 xcode-27
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            scheme_keyword: "ios"
            destination: "generic/platform=iOS"
            rust_target: "aarch64-apple-ios"
            artifact: meow-iOS
          - platform: tvOS
            scheme_keyword: "tvos"
            destination: "generic/platform=tvOS"
            rust_target: "aarch64-apple-tvos"
            artifact: meow-tvOS

    steps:
      - name: Checkout meow-ios Repository
        uses: actions/checkout@v4
        with:
          repository: meow-rs/meow-ios
          fetch-depth: 0
          submodules: recursive

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.rust_target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.rust_target }}-

      - name: Cache SwiftPM Packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved', '**/*.xcodeproj/project.pbxproj') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Build Rust Backend
        run: |
          set -euo pipefail
          echo "=== 编译 Rust Target: ${{ matrix.rust_target }} ==="
          
          if [ -f "./build.sh" ]; then
            chmod +x ./build.sh
            ./build.sh
          elif [ -f "./scripts/build.sh" ]; then
            chmod +x ./scripts/build.sh
            ./scripts/build.sh
          else
            cargo build --release --target ${{ matrix.rust_target }}
          fi

      - name: Detect Workspace / Project & Scheme
        id: proj
        run: |
          set -euo pipefail
          echo "=== 检测工程与 Scheme 列表 ==="
          
          if [ -f "$(find . -maxdepth 2 -name '*.xcworkspace' | head -1)" ]; then
            PROJ_FLAG="-workspace $(find . -maxdepth 2 -name '*.xcworkspace' | head -1)"
          else
            PROJ_FILE=$(find . -maxdepth 2 -name "*.xcodeproj" | head -1)
            PROJ_FLAG="-project $PROJ_FILE"
          fi
          echo "proj_flag=$PROJ_FLAG" >> "$GITHUB_OUTPUT"

          SCHEME=$(xcodebuild$PROJ_FLAG -list -json | python3 -c "
          import sys, json
          target_platform = '${{ matrix.scheme_keyword }}'.lower()
          try:
              data = json.load(sys.stdin)
              schemes = data.get('workspace', {}).get('schemes', []) or data.get('project', {}).get('schemes', [])
              filtered = [s for s in schemes if 'test' not in s.lower() and 'extension' not in s.lower()]
              
              matched = [s for s in filtered if target_platform in s.lower()]
              if matched:
                  print(matched[0])
              elif filtered:
                  print(filtered[0])
              else:
                  print('meow')
          except Exception:
              print('meow')
          ")
          echo "Selected Scheme: $SCHEME"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Disable Code Signing in Project
        run: |
          set -euo pipefail
          echo "=== 强制关闭所有 Target 的 Automatic 签名校验 ==="
          python3 -c "
          import re, glob

          for pbx in glob.glob('**/*.pbxproj', recursive=True):
              with open(pbx, 'r', encoding='utf-8') as f:
                  content = f.read()

              content = re.sub(r'CODE_SIGN_STYLE\s*=\s*Automatic;', 'CODE_SIGN_STYLE = Manual;', content)
              content = re.sub(r'PROVISIONING_PROFILE_SPECIFIER\s*=\s*[^;]+;', 'PROVISIONING_PROFILE_SPECIFIER = \"\";', content)
              content = re.sub(r'\"?PROVISIONING_PROFILE\"?\s*=\s*[^;]+;', 'PROVISIONING_PROFILE = \"\";', content)
              content = re.sub(r'CODE_SIGN_IDENTITY\s*=\s*[^;]+;', 'CODE_SIGN_IDENTITY = \"\";', content)
              content = re.sub(r'DEVELOPMENT_TEAM\s*=\s*[^;]+;', 'DEVELOPMENT_TEAM = \"\";', content)

              with open(pbx, 'w', encoding='utf-8') as f:
                  f.write(content)
              print(f'Stripped signing configuration from: {pbx}')
          "

      - name: Build and Archive ${{ matrix.platform }}
        id: archive
        run: |
          set -euo pipefail
          ARCHIVE_DIR="${{ runner.temp }}/archives"
          mkdir -p "$ARCHIVE_DIR"
          ARCHIVE_PATH="$ARCHIVE_DIR/${{ matrix.artifact }}.xcarchive"

          SCHEME="${{ steps.proj.outputs.scheme }}"
          PROJ_FLAG="${{ steps.proj.outputs.proj_flag }}"

          echo "Archiving ${{ matrix.platform }} with scheme:$SCHEME..."
          xcodebuild \
            $PROJ_FLAG \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "${{ matrix.destination }}" \
            archive \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            PROVISIONING_PROFILE_SPECIFIER=""

          echo "archive_path=$ARCHIVE_PATH" >> "$GITHUB_OUTPUT"

      - name: Package Unsigned IPA
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          OUT_DIR="${{ runner.temp }}/artifacts"
          mkdir -p "$OUT_DIR"

          ARCHIVE_PATH="${{ steps.archive.outputs.archive_path }}"
          echo "Archive path: $ARCHIVE_PATH"

          APP_PATH=""
          if [ -d "$ARCHIVE_PATH/Products/Applications" ]; then
            APP_PATH=$(find "$ARCHIVE_PATH/Products/Applications" -maxdepth 2 -name "*.app" | head -n 1)
          fi

          if [ -z "$APP_PATH" ] && [ -d "$ARCHIVE_PATH/Products" ]; then
            APP_PATH=$(find "$ARCHIVE_PATH/Products" -name "*.app" | head -n 1)
          fi

          if [ -z "$APP_PATH" ]; then
            echo "::error::未在 $ARCHIVE_PATH 下找到任何 .app 目标文件"
            find "$ARCHIVE_PATH" -maxdepth 3 -ls || true
            exit 1
          fi

          echo "Found app target: $APP_PATH"
          echo "Packaging Payload for ${{ matrix.platform }}..."

          PAYLOAD_DIR="${{ runner.temp }}/Payload"
          rm -rf "$PAYLOAD_DIR"
          mkdir -p "$PAYLOAD_DIR"

          cp -R "$APP_PATH" "$PAYLOAD_DIR/"

          IPA_NAME="${{ matrix.artifact }}-${VERSION}.ipa"
          (cd "${{ runner.temp }}" && zip -qr "$OUT_DIR/$IPA_NAME" Payload)
          rm -rf "$PAYLOAD_DIR"

          echo "Generated: $OUT_DIR/$IPA_NAME"
          ls -lh "$OUT_DIR"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ inputs.version }}
          path: ${{ runner.temp }}/artifacts/*
          retention-days: 7
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List Release Assets
        run: |
          echo "=== 待发布的文件 ==="
          find release-assets -type f -ls

      - name: Create Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: meow-v${{ inputs.version }}
          name: meow v${{ inputs.version }}
          body: |
            ## meow v${{ inputs.version }} (Unsigned Builds)

            ### 产物文件
            - **iOS**: `meow-iOS-*.ipa`
            - **tvOS**: `meow-tvOS-*.ipa`

            ### 说明
            - 源码拉取自 `meow-rs/meow-ios`
            - 无签名独立构建 (`CODE_SIGNING_ALLOWED=NO`)
            - 适配 TrollStore、AltStore、Sideloadly 或通过个人证书自签名安装。
          draft: false
          prerelease: ${{ inputs.prerelease }}
          files: |
            release-assets/**
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
